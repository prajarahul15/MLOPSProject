apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlops-api-deploy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlops-api
  template:
    metadata:
      labels:
        app: mlops-api
    spec:
      containers:
        - name: mlops-api
          image: prajarahul15/mlops-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000

---
apiVersion: v1
kind: Service
metadata:
  name: mlops-api-svc
spec:
  type: NodePort
  selector:
    app: mlops-api
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
      nodePort: 30080
