apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlops-ui-deploy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlops-ui
  template:
    metadata:
      labels:
        app: mlops-ui
    spec:
      containers:
        - name: mlops-ui
          image: prajarahul15/mlops-ui:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8501

---
apiVersion: v1
kind: Service
metadata:
  name: mlops-ui-svc
spec:
  type: NodePort
  selector:
    app: mlops-ui
  ports:
    - protocol: TCP
      port: 8501
      targetPort: 8501
      nodePort: 30001
