name: CI-CD Pipeline

on:
  push:
    branches:
      - master

jobs:
  build:
    name: Build & Push to DockerHub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build API Docker image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/mlops-api:latest -f mlops-e2e-project/docker/Dockerfile.api mlops-e2e-project

      - name: Build UI Docker image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/mlops-ui:latest -f mlops-e2e-project/docker/Dockerfile.api mlops-e2e-project

      - name: Push API image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/mlops-api:latest

      - name: Push UI image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/mlops-ui:latest

  deploy:
    name: Deploy to Kubernetes
    runs-on: self-hosted
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.USER_KUBE_CONFIG_DATA }}" > ~/.kube/config

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/api-deployment.yaml
          kubectl apply -f k8s/ui-deployment.yaml
